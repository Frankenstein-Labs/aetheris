name: Import Appwrite source into Aetheris

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-appwrite.yml"

permissions:
  contents: write

jobs:
  import-appwrite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Clone the official Appwrite main branch with full history
        run: |
          set -euo pipefail
          git clone --single-branch --branch main --no-tags https://github.com/appwrite/appwrite.git /tmp/appwrite
          cd /tmp/appwrite
          echo "Source commit: $(git rev-parse HEAD)"
          echo "Tracked files: $(git ls-files | wc -l)"
          git remote add aetheris "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force aetheris HEAD:refs/heads/main
        env:
          GITHUB_TOKEN: ${{ github.token }}
